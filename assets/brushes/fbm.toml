name="fbm"
description="fractal Brownian motion"
output="normalized"
script="fbm(x, y, z, frequency, lacunarity, persistence, octaves)"
gpu_script = "return fbm(x, y, z, param_frequency, param_lacunarity, param_persistence, int(param_octaves));"

[[parameter]]
name="frequency"
type="float"
control="slider"
min="0.1"
max="100.0"
scale="log"
default="4.0"

[[parameter]]
name="lacunarity"
type="float"
control="slider"
min="0.0"
max="10.0"
scale="linear"
default="2.0"

[[parameter]]
name="persistence"
type="float"
control="slider"
min="0.0"
max="5.0"
scale="linear"
default="0.5"

[[parameter]]
name="octaves"
type="integer"
control="spin"
min="1"
max="16"
default="6"
