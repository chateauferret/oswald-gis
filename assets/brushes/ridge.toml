name = "Ridge Noise"
description = "FastNoise2 ridged fractal Simplex noise."
output = "normalized"
script = "ridged(x, y, z, Frequency, Lacunarity, Persistence, Octaves)"
gpu_script = "return ridged(x, y, z, param_Frequency, param_Lacunarity, param_Persistence, int(param_Octaves));"

[[parameter]]
name = "Frequency"
type = "float"
control = "slider"
min = 0.01
max = 1000000
scale = "log"
default = 4

[[parameter]]
name = "Lacunarity"
type = "float"
control = "slider"
min = 1
max = 4
default = 2

[[parameter]]
name = "Persistence"
type = "float"
control = "slider"
min = 0
max = 1
default = 0.5

[[parameter]]
name = "Octaves"
type = "integer"
control = "slider"
min = 1
max = 16
default = 4
