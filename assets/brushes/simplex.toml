name = "Simplex Noise"
description = "FastNoise2 fractal Simplex noise, optionally billowed."
output = "normalized"
script = '''
var h := fbm(x, y, z, Frequency, Lacunarity, Persistence, Octaves);
Billowed == 'Yes' ? 2 * abs(h) - 1 : h
'''
gpu_script = '''
float h = fbm(x, y, z, param_Frequency, param_Lacunarity,
              param_Persistence, int(param_Octaves));
return param_Billowed > 0.5 ? 2.0 * abs(h) - 1.0 : h;
'''

[[parameter]]
name = "Frequency"
type = "float"
control = "slider"
min = 0.01
max = 1000000
scale = "log"
default = 4

[[parameter]]
name = "Lacunarity"
type = "float"
control = "slider"
min = 1
max = 4
default = 2

[[parameter]]
name = "Persistence"
type = "float"
control = "slider"
min = 0
max = 1
default = 0.5

[[parameter]]
name = "Octaves"
type = "integer"
control = "slider"
min = 1
max = 16
default = 4

[[parameter]]
name = "Billowed"
type = "choice"
choices = ["No", "Yes"]
default = "No"
